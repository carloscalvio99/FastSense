# =====================================================================
# FastSense · Nginx de borde (L7)
#  - least_conn + keepalive 32 hacia la API
#  - rate limiting 100 r/m, burst 20, nodelay
#  - timeouts estrictos 2s/5s
#  - propagación de X-Request-ID $request_id
# =====================================================================
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Trazabilidad: una línea JSON por petición.
    log_format fastsense_json escape=json
      '{"timestamp":"$time_iso8601","level":"INFO","layer":"nginx",'
      '"request_id":"$request_id","remote_addr":"$remote_addr",'
      '"method":"$request_method","path":"$uri","status":$status,'
      '"latency_ms":$request_time,"upstream_latency":"$upstream_response_time",'
      '"upstream_status":"$upstream_status"}';
    access_log /var/log/nginx/access.log fastsense_json;

    # Docker DNS. Permite resolver réplicas de "api" sin reiniciar Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cabecera de bypass para pruebas de carga y demos controladas.
    # Sin la cabecera, el rate limiting se aplica normalmente por IP.
    map $http_x_demo_bypass $rate_limit_key {
        default                    $binary_remote_addr;
        "fastsense-demo-bypass"    "";
    }

    limit_req_zone $rate_limit_key zone=fastsense_ratelimit:10m rate=100r/m;
    limit_req_status 429;

    upstream fastsense_backend {
        zone fastsense_backend 64k;
        least_conn;
        server api:8080 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;

        # Sondas sin rate limit para healthchecks de Docker/K8s.
        location = /health {
            access_log off;
            proxy_pass http://fastsense_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        location = /ready {
            access_log off;
            proxy_pass http://fastsense_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        # Operación/MLOps: el hot reload descarga el artefacto desde S3 y puede
        # tardar más que el presupuesto de 5 s de la ruta caliente.
        location /internal/ {
            proxy_pass http://fastsense_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 2s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            add_header X-Request-ID $request_id always;
        }

        location / {
            limit_req zone=fastsense_ratelimit burst=20 nodelay;

            proxy_pass http://fastsense_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # El request-id se propaga a FastAPI y luego a los logs JSON.
            proxy_hide_header X-Request-ID;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
        }
    }
}
